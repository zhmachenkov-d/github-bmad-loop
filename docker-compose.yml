services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bmad
      POSTGRES_PASSWORD: bmad
      POSTGRES_DB: bmad
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmad -d bmad"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
