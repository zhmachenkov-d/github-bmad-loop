[project]
name = "github-bmad-loop"
version = "0.1.0"
description = "GitHub App + Slack BMAD orchestration factory control plane"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3,<3.4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.20,<2",
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "pre-commit>=4.0",
    "hypothesis>=6",
    "mutmut>=3",
    "semgrep>=1.90",
]

[project.scripts]
bmad-worker = "apps.worker.__main__:main"
bmad-outbox = "apps.outbox.__main__:main"
bmad-gateway = "apps.gateway.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests", "alembic", "scripts"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

[tool.mutmut]
source_paths = ["src"]
# Assets needed when tests run under mutants/ (mutmut does not copy them by default).
also_copy = ["alembic.ini", "alembic", ".ci"]
pytest_add_cli_args_test_selection = ["tests"]
