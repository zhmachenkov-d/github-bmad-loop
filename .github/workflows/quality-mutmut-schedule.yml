# Scheduled full mutmut vs baseline; score drop ≥ 1 or survived/no_tests growth fails + Slack.
name: quality-mutmut-schedule

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  mutmut-full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bmad
          POSTGRES_PASSWORD: bmad
          POSTGRES_DB: bmad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmad -d bmad"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://bmad:bmad@localhost:5432/bmad
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen --extra dev

      - name: Full mutmut + baseline compare
        id: mutmut
        run: |
          set +e
          uv run python .ci/run_mutmut_full.py --compare-baseline
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload mutmut (full) SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: .ci/out/mutmut-full.sarif
          category: mutmut-full

      - name: Build aggregated Slack payload
        id: slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set +e
          uv run python .ci/slack_notify.py \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --server-url "${{ github.server_url }}" \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --worsen .ci/out/mutmut-worsen.json \
            --output .ci/out/slack-payload.json
          set -e
          # secrets context is not allowed in step `if:`; gate here via env instead
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ] \
            && [ -f .ci/out/slack-payload.json ] && grep -q '"text"' .ci/out/slack-payload.json; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack on worsen
        if: always() && steps.slack.outputs.should_notify == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: .ci/out/slack-payload.json
          payload-templated: false

      - name: Fail job on mutmut worsen or tool crash
        if: always()
        run: |
          MU="${{ steps.mutmut.outputs.exit_code }}"
          echo "mutmut exit=$MU"
          if [ "$MU" != "0" ]; then
            exit 1
          fi
